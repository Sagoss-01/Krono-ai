<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netiify Webmail</title>
  <!-- Tailwind + DaisyUI compilés localement via: npm run tw:build -->
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ── Variables ── */
    :root {
      --accent:    #3b82f6;
      --accent-lo: rgba(59,130,246,0.15);
      --border:    rgba(59,130,246,0.1);
      --bg-main:   #0f172a;
      --bg-panel:  rgba(15,23,42,0.98);
      --bg-hover:  rgba(59,130,246,0.07);
      --text-1:    #f1f5f9;
      --text-2:    #cbd5e1;
      --text-3:    #94a3b8;
      --text-muted:#475569;
    }
    [data-theme="light"] {
      --bg-main:   #f8fafc;
      --bg-panel:  rgba(248,250,252,0.98);
      --bg-hover:  rgba(59,130,246,0.05);
      --text-1:    #0f172a;
      --text-2:    #334155;
      --text-3:    #64748b;
      --text-muted:#94a3b8;
      --border:    rgba(59,130,246,0.12);
    }

    /* ── Base ── */
    * { font-family: 'Sora', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: var(--bg-main); color: var(--text-1); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* ── Layout ── */
    #app { display: none; height: 100vh; flex-direction: column; overflow: hidden; }
    #app.active { display: flex; }

    /* ── Topbar ── */
    .topbar {
      height: 52px; flex-shrink: 0;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 0 14px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 230px; min-width: 230px; flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: width .25s, min-width .25s;
      overflow: hidden;
    }
    .sidebar.collapsed { width: 56px; min-width: 56px; }
    .sidebar.collapsed .sl-label,
    .sidebar.collapsed .sl-badge,
    .sidebar.collapsed .sl-section { display: none; }
    .sidebar.collapsed .folder-item { justify-content: center; padding: 10px 8px; }

    .folder-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 14px; margin: 2px 8px;
      border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 450; color: var(--text-3);
      transition: all .13s;
    }
    .folder-item:hover { background: var(--bg-hover); color: var(--accent); }
    .folder-item.active {
      background: var(--accent-lo); color: #60a5fa;
      border-left: 2px solid var(--accent); margin-left: 6px; padding-left: 12px;
    }
    [data-theme="light"] .folder-item.active { color: #2563eb; }

    /* ── Email list panel ── */
    .list-panel {
      width: 320px; min-width: 260px; flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .list-header { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

    .email-item {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      cursor: pointer; position: relative; transition: background .1s;
    }
    .email-item:hover { background: var(--bg-hover); }
    .email-item.active { background: var(--accent-lo); border-left: 3px solid var(--accent); }
    .email-item.unread .ei-subject { font-weight: 700; color: var(--text-1); }
    .email-item.unread::after {
      content: ''; position: absolute; top: 14px; right: 12px;
      width: 7px; height: 7px; background: var(--accent); border-radius: 50%;
    }
    .ei-from    { font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 3px; }
    .ei-subject { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .ei-date    { font-size: 11px; color: var(--text-muted); }
    .ei-stale   { font-size: 10px; color: var(--text-muted); font-style: italic; }

    /* ── View panel ── */
    .view-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .view-header { padding: 18px 28px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .view-body   { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .mail-html   { max-width: 740px; font-size: 14px; line-height: 1.75; color: var(--text-2); }
    .mail-html img { max-width: 100%; height: auto; border-radius: 6px; }
    .mail-html a   { color: var(--accent); text-decoration: underline; }

    /* ── Buttons ── */
    .btn-icon {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 7px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-3); cursor: pointer; transition: all .13s; flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--accent-lo); color: var(--accent); border-color: rgba(59,130,246,0.3); }
    .btn-icon.danger:hover { background: rgba(239,68,68,.12); color: #f87171; border-color: rgba(239,68,68,.3); }

    /* ── Input ── */
    .inp {
      width: 100%; padding: 8px 12px; border-radius: 8px; font-size: 13px;
      background: rgba(30,41,59,.7); border: 1px solid var(--border);
      color: var(--text-1); outline: none; transition: border-color .15s;
    }
    .inp:focus { border-color: rgba(59,130,246,.5); }
    [data-theme="light"] .inp { background: rgba(241,245,249,.9); }

    /* ── Avatar ── */
    .avatar {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg,#3b82f6,#8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: white;
    }

    /* ── Compose ── */
    .compose-wrap {
      position: fixed; bottom: 0; right: 20px; width: 520px;
      background: #0f172a; border: 1px solid rgba(59,130,246,.25); border-bottom: none;
      border-radius: 12px 12px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,.4);
      z-index: 900; display: none; flex-direction: column; max-height: 560px;
    }
    [data-theme="light"] .compose-wrap { background: #fff; }
    .compose-wrap.open { display: flex; }

    /* ── Toast ── */
    #toasts {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    .toast {
      padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
      animation: fadeUp .25s ease; box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .7s linear infinite; }

    /* ── Empty ── */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; opacity: .45; }

    /* ── Login ── */
    #login-screen {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,.12), transparent 60%), #0f172a;
    }
    [data-theme="light"] #login-screen { background: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,.06), transparent 60%), #f8fafc; }
    .login-card {
      width: 100%; max-width: 360px; padding: 36px;
      background: rgba(15,23,42,.95);
      border: 1px solid rgba(59,130,246,.2); border-radius: 20px;
      box-shadow: 0 24px 48px rgba(0,0,0,.5);
    }
    [data-theme="light"] .login-card { background: rgba(255,255,255,.98); box-shadow: 0 24px 48px rgba(0,0,0,.1); }

    /* ── Cache badge ── */
    .cache-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 600;
      background: rgba(245,158,11,.12); color: #fbbf24; border: 1px solid rgba(245,158,11,.2);
    }

    /* ── Notif pulse ── */
    .notif-dot { width:7px;height:7px;background:#ef4444;border-radius:50%; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }

    /* ── Section label ── */
    .sl-section { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: 12px 16px 4px; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; height: 100vh; z-index: 200; transform: translateX(-100%); transition: transform .25s; width: 230px !important; min-width: 230px !important; }
      .sidebar.mobile-open { transform: translateX(0); }
      .list-panel { width: 100%; }
      .view-panel { position: fixed; inset: 0; z-index: 150; background: var(--bg-main); display: none; flex-direction: column; }
      .view-panel.mobile-open { display: flex; }
      .compose-wrap { width: calc(100vw - 16px); right: 8px; }
      .view-body { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════ LOGIN ═══════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px;">
      <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>
      <div>
        <div style="font-weight:700;font-size:17px;color:var(--text-1);">Netiify Mail</div>
        <div style="font-size:11px;color:var(--text-muted);">mail.netiify.cloud</div>
      </div>
    </div>

    <div id="login-err" style="display:none;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#f87171;"></div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.07em;display:block;margin-bottom:5px;">EMAIL</label>
        <input id="l-email" type="email" placeholder="vous@netiify.cloud" class="inp" style="padding:10px 14px;" />
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.07em;display:block;margin-bottom:5px;">MOT DE PASSE</label>
        <input id="l-pwd" type="password" placeholder="••••••••" class="inp" style="padding:10px 14px;" />
      </div>
    </div>

    <button id="l-btn" onclick="doLogin()" style="width:100%;margin-top:20px;padding:11px;border-radius:11px;border:none;cursor:pointer;font-weight:600;font-size:14px;color:white;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 16px rgba(59,130,246,.3);">
      Se connecter
    </button>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--text-muted);">IMAP 993 SSL · SMTP 587 STARTTLS</div>
  </div>
</div>

<!-- ═══════════════════════ APP ═══════════════════════ -->
<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="btn-icon" onclick="toggleSidebar()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div style="display:flex;align-items:center;gap:8px;margin-right:auto;">
      <div style="width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="white"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>
      <span style="font-weight:700;font-size:14px;color:var(--text-1);" class="hidden-xs">Netiify Mail</span>
    </div>

    <div style="position:relative;">
      <button class="btn-icon" id="notif-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <span id="notif-dot" class="notif-dot" style="position:absolute;top:-2px;right:-2px;display:none;"></span>
    </div>

    <button class="btn-icon" onclick="toggleTheme()">
      <svg id="ico-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="ico-sun"  width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    </button>

    <div style="display:flex;align-items:center;gap:8px;">
      <div class="avatar" id="top-avatar">?</div>
      <span style="font-size:12px;color:var(--text-3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="top-email">—</span>
      <button class="btn-icon" onclick="doLogout()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- BODY -->
  <div style="display:flex;flex:1;overflow:hidden;">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div style="padding:10px;">
        <button onclick="openCompose()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:13px;color:white;background:linear-gradient(135deg,#3b82f6,#2563eb);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span class="sl-label">Nouveau message</span>
        </button>
      </div>

      <div class="sl-section sl-label">Dossiers</div>

      <div id="folders-list" style="flex:1;overflow-y:auto;">
        <div class="folder-item active" data-folder="INBOX" onclick="selectFolder('INBOX',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span class="sl-label" style="flex:1;">Boîte de réception</span>
          <span class="sl-badge" id="inbox-badge" style="font-size:11px;padding:1px 7px;border-radius:20px;background:var(--accent-lo);color:#60a5fa;display:none;"></span>
        </div>
        <div class="folder-item" data-folder="Sent" onclick="selectFolder('Sent',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span class="sl-label">Envoyés</span>
        </div>
        <div class="folder-item" data-folder="Drafts" onclick="selectFolder('Drafts',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="sl-label">Brouillons</span>
        </div>
        <div class="folder-item" data-folder="Junk" onclick="selectFolder('Junk',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span class="sl-label">Spam</span>
        </div>
        <div class="folder-item" data-folder="Trash" onclick="selectFolder('Trash',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span class="sl-label">Corbeille</span>
        </div>
        <div id="extra-folders"></div>
      </div>

      <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:7px;">
        <div style="width:7px;height:7px;background:#22c55e;border-radius:50%;"></div>
        <span class="sl-label" style="font-size:11px;color:var(--text-muted);">Connecté</span>
      </div>
    </div>

    <!-- LIST PANEL -->
    <div class="list-panel" id="list-panel">
      <div class="list-header">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span id="folder-title" style="font-weight:600;font-size:14px;color:var(--text-1);flex:1;">Boîte de réception</span>
          <span id="cache-badge" class="cache-tag" style="display:none;">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 12A10 10 0 1 1 12 2"/><polyline points="22 2 22 8 16 8"/></svg>
            Cache
          </span>
          <button class="btn-icon" onclick="refreshEmails(true)" id="refresh-btn" title="Actualiser">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
        <input type="text" class="inp" id="search-inp" placeholder="Rechercher…" oninput="filterEmails()" />
      </div>

      <div id="list-loading" style="display:flex;align-items:center;justify-content:center;padding:32px;gap:10px;color:var(--text-muted);font-size:13px;">
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Chargement…
      </div>
      <div id="list-empty" style="display:none;" class="empty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span style="font-size:13px;">Aucun email</span>
      </div>
      <div id="list-items" style="display:none;overflow-y:auto;flex:1;"></div>
    </div>

    <!-- VIEW PANEL -->
    <div class="view-panel" id="view-panel">
      <div id="view-empty" class="empty" style="height:100%;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span style="font-size:13px;">Sélectionnez un email</span>
      </div>
      <div id="view-loading" style="display:none;" class="empty" style="height:100%;">
        <svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      </div>
      <div id="view-content" style="display:none;flex-direction:column;height:100%;">
        <div class="view-header">
          <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;">
            <h2 id="v-subject" style="flex:1;font-weight:700;font-size:18px;color:var(--text-1);line-height:1.3;margin:0;"></h2>
            <div style="display:flex;gap:6px;flex-shrink:0;">
              <button class="btn-icon" onclick="replyEmail()" title="Répondre"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></button>
              <button class="btn-icon" onclick="forwardEmail()" title="Transférer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg></button>
              <button class="btn-icon danger" onclick="deleteCurrentEmail()" title="Supprimer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
              <button class="btn-icon" onclick="closeMobileView()" style="display:none;" id="back-btn" title="Retour"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="avatar" id="v-avatar">?</div>
            <div style="flex:1;min-width:0;">
              <div id="v-from" style="font-size:13px;font-weight:600;color:var(--text-2);"></div>
              <div id="v-to"   style="font-size:12px;color:var(--text-muted);"></div>
            </div>
            <div id="v-date" style="font-size:11px;color:var(--text-muted);flex-shrink:0;"></div>
          </div>
          <div id="v-attachments" style="display:none;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>
        <div class="view-body">
          <div id="v-body" class="mail-html"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════ COMPOSE ═══════ -->
<div class="compose-wrap" id="compose">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);">
    <span id="compose-title" style="font-weight:600;font-size:13px;color:var(--text-1);">Nouveau message</span>
    <div style="display:flex;gap:6px;">
      <button class="btn-icon" onclick="closeCompose()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;padding:12px;flex:1;overflow-y:auto;">
    <input id="c-to"      type="email" class="inp" placeholder="À :" />
    <input id="c-cc"      type="email" class="inp" placeholder="Cc :" />
    <input id="c-subject" type="text"  class="inp" placeholder="Objet" />
    <textarea id="c-body" class="inp" rows="9" style="resize:none;line-height:1.6;" placeholder="Votre message…"></textarea>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--border);">
    <button onclick="sendEmail()" style="display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;color:white;background:linear-gradient(135deg,#3b82f6,#2563eb);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Envoyer
    </button>
    <span id="c-status" style="font-size:12px;color:var(--text-muted);"></span>
  </div>
</div>

<!-- ═══════ TOASTS ═══════ -->
<div id="toasts"></div>

<script>
// ════════════════════════════════════════════════════
//  ÉTAT
// ════════════════════════════════════════════════════
const S = {
  emails: [],         // liste courante (serveur ou cache)
  filtered: [],       // après recherche
  currentFolder: 'INBOX',
  currentUid: null,
  currentEmail: null,
  userEmail: null,
  sidebarCollapsed: false,
  socket: null,
  fromCache: false,
};

// Clé cache pour un dossier
const cacheKey = folder => `mail_cache_${S.userEmail}_${folder}`;

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
(async () => {
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  const me = await api('/api/me');
  if (me.ok) await bootApp(me.email);
})();

async function bootApp(email) {
  S.userEmail = email;
  document.getElementById('top-email').textContent = email;
  document.getElementById('top-avatar').textContent = email[0].toUpperCase();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  await loadFolders();
  await loadEmails(false); // false = affiche cache d'abord
  startSocket();
}

// ════════════════════════════════════════════════════
//  API helper
// ════════════════════════════════════════════════════
async function api(url, opts) {
  try {
    const r = await fetch(url, opts);
    return await r.json();
  } catch(e) {
    return { ok: false, error: e.message };
  }
}

// ════════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  const btn   = document.getElementById('l-btn');
  const err   = document.getElementById('login-err');
  if (!email || !pwd) { showLoginErr('Remplissez tous les champs'); return; }
  btn.textContent = 'Connexion…'; btn.disabled = true; err.style.display = 'none';
  const res = await api('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password: pwd }) });
  if (res.ok) {
    await bootApp(res.email);
  } else {
    showLoginErr(res.error || 'Identifiants incorrects');
    btn.textContent = 'Se connecter'; btn.disabled = false;
  }
}
function showLoginErr(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}
async function doLogout() {
  await api('/api/logout', { method: 'POST' });
  location.reload();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') doLogin();
});

// ════════════════════════════════════════════════════
//  DOSSIERS
// ════════════════════════════════════════════════════
async function loadFolders() {
  const res = await api('/api/folders');
  if (!res.ok) return;
  const known = ['INBOX','Sent','Drafts','Junk','Spam','Trash','INBOX.Sent','INBOX.Trash','INBOX.Junk','INBOX.Drafts'];
  const extra = res.folders.filter(f => !known.some(k => k.toLowerCase() === f.toLowerCase()));
  if (extra.length) {
    document.getElementById('extra-folders').innerHTML =
      `<div class="sl-section sl-label" style="margin-top:8px;">Autres</div>` +
      extra.map(f => `
        <div class="folder-item" data-folder="${esc(f)}" onclick="selectFolder('${esc(f)}',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="sl-label">${esc(f)}</span>
        </div>`).join('');
  }
}

function selectFolder(folder, el) {
  S.currentFolder = folder;
  S.currentEmail  = null;
  S.currentUid    = null;
  document.querySelectorAll('.folder-item').forEach(f => f.classList.remove('active'));
  el.classList.add('active');
  const titles = { INBOX:'Boîte de réception', Sent:'Envoyés','INBOX.Sent':'Envoyés', Drafts:'Brouillons', Junk:'Spam', Spam:'Spam', Trash:'Corbeille','INBOX.Trash':'Corbeille' };
  document.getElementById('folder-title').textContent = titles[folder] || folder;
  hideViewPanel();
  loadEmails(false);
  document.getElementById('sidebar').classList.remove('mobile-open');
}

// ════════════════════════════════════════════════════
//  EMAILS — LISTE (avec cache)
// ════════════════════════════════════════════════════
async function loadEmails(forceRefresh) {
  const key = cacheKey(S.currentFolder);

  // 1. Afficher le cache immédiatement si dispo
  if (!forceRefresh) {
    try {
      const cached = JSON.parse(localStorage.getItem(key) || 'null');
      if (cached && Array.isArray(cached.emails)) {
        S.emails   = cached.emails;
        S.filtered = [...S.emails];
        S.fromCache = true;
        renderList();
        document.getElementById('cache-badge').style.display = 'inline-flex';
      }
    } catch (_) {}
  }

  // 2. Requête serveur en arrière-plan
  showListLoading(!S.fromCache); // spinner seulement si pas de cache
  const res = await api(`/api/emails?folder=${encodeURIComponent(S.currentFolder)}&limit=80`);

  if (res.ok) {
    S.emails   = res.emails;
    S.filtered = [...S.emails];
    S.fromCache = false;
    // Sauvegarder en cache
    try { localStorage.setItem(key, JSON.stringify({ emails: res.emails, ts: Date.now() })); } catch(_) {}
    document.getElementById('cache-badge').style.display = 'none';
    renderList();

    // Badge non-lus
    if (S.currentFolder === 'INBOX') {
      const n = res.emails.filter(e => !e.flags.includes('\\Seen')).length;
      const badge = document.getElementById('inbox-badge');
      if (n > 0) { badge.textContent = n; badge.style.display = 'inline-block'; }
      else badge.style.display = 'none';
    }
  } else {
    if (!S.fromCache) toast('Erreur chargement : ' + res.error, 'error');
  }
  showListLoading(false);
}

async function refreshEmails(forceRefresh) {
  const btn = document.getElementById('refresh-btn');
  btn.querySelector('svg').classList.add('spin');
  await loadEmails(forceRefresh !== false);
  btn.querySelector('svg').classList.remove('spin');
  if (!S.fromCache) toast('Boîte actualisée', 'success');
}

function filterEmails() {
  const q = document.getElementById('search-inp').value.toLowerCase();
  S.filtered = q
    ? S.emails.filter(e => (e.headers.subject || '').toLowerCase().includes(q) || (e.headers.from || '').toLowerCase().includes(q))
    : [...S.emails];
  renderList();
}

function showListLoading(show) {
  document.getElementById('list-loading').style.display = show ? 'flex' : 'none';
}

function renderList() {
  showListLoading(false);
  const container = document.getElementById('list-items');
  const empty     = document.getElementById('list-empty');
  if (S.filtered.length === 0) {
    container.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  container.style.display = 'block';
  empty.style.display = 'none';

  container.innerHTML = S.filtered.map(email => {
    const isUnread = !email.flags.includes('\\Seen');
    const from     = parseFrom(email.headers.from || '');
    const date     = fmtDate(email.headers.date);
    const isActive = email.uid === S.currentUid;
    return `
      <div class="email-item ${isUnread?'unread':''} ${isActive?'active':''}" data-uid="${email.uid}" onclick="openEmail(${email.uid})">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;">
          <div class="ei-from" style="${isUnread?'color:#93c5fd;':''}">${esc(from.name||from.email)}</div>
          <div class="ei-date">${date}</div>
        </div>
        <div class="ei-subject">${esc(email.headers.subject||'(Pas de sujet)')}</div>
      </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  EMAIL — AFFICHAGE
// ════════════════════════════════════════════════════
async function openEmail(uid) {
  S.currentUid = uid;
  document.querySelectorAll('.email-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.uid) === uid));

  // Marquer comme lu localement
  const meta = S.emails.find(e => e.uid === uid);
  if (meta && !meta.flags.includes('\\Seen')) {
    meta.flags.push('\\Seen');
    document.querySelector(`.email-item[data-uid="${uid}"]`)?.classList.remove('unread');
  }

  showView('loading');
  document.getElementById('view-panel').classList.add('mobile-open');
  document.getElementById('back-btn').style.display = 'flex';

  const res = await api(`/api/email/${uid}?folder=${encodeURIComponent(S.currentFolder)}`);
  if (!res.ok) { toast('Erreur : ' + res.error, 'error'); showView('empty'); return; }

  const e = res.email;
  S.currentEmail = e;

  const from = parseFrom(e.from || '');
  document.getElementById('v-subject').textContent = e.subject || '(Pas de sujet)';
  document.getElementById('v-from').textContent    = e.from || '';
  document.getElementById('v-to').textContent      = 'À : ' + (e.to || '');
  document.getElementById('v-date').textContent    = e.date ? new Date(e.date).toLocaleString('fr-FR') : '';
  document.getElementById('v-avatar').textContent  = (from.name||from.email||'?')[0].toUpperCase();

  const bodyEl = document.getElementById('v-body');
  if (e.html) {
    bodyEl.innerHTML = sanitize(e.html);
  } else {
    bodyEl.innerHTML = `<pre style="white-space:pre-wrap;font-family:inherit;font-size:14px;">${esc(e.text||'')}</pre>`;
  }

  const attEl = document.getElementById('v-attachments');
  if (e.attachments && e.attachments.length) {
    attEl.style.display = 'flex';
    attEl.innerHTML = e.attachments.map(a => `
      <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--accent-lo);color:#93c5fd;border:1px solid rgba(59,130,246,.2);">
        📎 ${esc(a.filename||'fichier')} (${fmtSize(a.size)})
      </span>`).join('');
  } else {
    attEl.style.display = 'none';
  }

  showView('content');
}

function showView(mode) {
  document.getElementById('view-empty').style.display   = mode==='empty'   ? 'flex' : 'none';
  document.getElementById('view-loading').style.display = mode==='loading' ? 'flex' : 'none';
  document.getElementById('view-content').style.display = mode==='content' ? 'flex' : 'none';
}

function hideViewPanel() {
  showView('empty');
  S.currentUid   = null;
  S.currentEmail = null;
}

function closeMobileView() {
  document.getElementById('view-panel').classList.remove('mobile-open');
}

async function deleteCurrentEmail() {
  if (!S.currentUid) return;
  const res = await api(`/api/email/${S.currentUid}?folder=${encodeURIComponent(S.currentFolder)}`, { method: 'DELETE' });
  if (res.ok) {
    toast('Email supprimé', 'success');
    S.emails   = S.emails.filter(e => e.uid !== S.currentUid);
    S.filtered = S.filtered.filter(e => e.uid !== S.currentUid);
    // Mettre à jour le cache
    try { localStorage.setItem(cacheKey(S.currentFolder), JSON.stringify({ emails: S.emails, ts: Date.now() })); } catch(_) {}
    hideViewPanel();
    renderList();
  } else toast(res.error, 'error');
}

// ════════════════════════════════════════════════════
//  COMPOSE
// ════════════════════════════════════════════════════
function openCompose() {
  document.getElementById('compose').classList.add('open');
  document.getElementById('c-to').focus();
  document.getElementById('compose-title').textContent = 'Nouveau message';
}
function closeCompose() {
  document.getElementById('compose').classList.remove('open');
  ['c-to','c-cc','c-subject','c-body'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('c-status').textContent = '';
}
function replyEmail() {
  if (!S.currentEmail) return;
  document.getElementById('c-to').value      = S.currentEmail.from || '';
  document.getElementById('c-subject').value = 'Re: ' + (S.currentEmail.subject || '');
  document.getElementById('c-body').value    = `\n\n---\nDe : ${S.currentEmail.from}\nDate : ${S.currentEmail.date ? new Date(S.currentEmail.date).toLocaleString('fr-FR') : ''}\n\n${S.currentEmail.text || ''}`;
  document.getElementById('compose-title').textContent = 'Répondre';
  document.getElementById('compose').classList.add('open');
}
function forwardEmail() {
  if (!S.currentEmail) return;
  document.getElementById('c-subject').value = 'Fwd: ' + (S.currentEmail.subject || '');
  document.getElementById('c-body').value    = `\n\n------- Message transféré -------\nDe : ${S.currentEmail.from}\n\n${S.currentEmail.text || ''}`;
  document.getElementById('compose-title').textContent = 'Transférer';
  document.getElementById('compose').classList.add('open');
  document.getElementById('c-to').focus();
}
async function sendEmail() {
  const to      = document.getElementById('c-to').value.trim();
  const cc      = document.getElementById('c-cc').value.trim();
  const subject = document.getElementById('c-subject').value.trim();
  const body    = document.getElementById('c-body').value.trim();
  const status  = document.getElementById('c-status');
  if (!to || !subject || !body) { status.style.color='#f87171'; status.textContent = 'Champs obligatoires manquants'; return; }
  status.style.color = '#60a5fa'; status.textContent = 'Envoi en cours…';
  const res = await api('/api/send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ to, cc, subject, body }) });
  if (res.ok) { toast('Email envoyé !', 'success'); closeCompose(); }
  else { status.style.color='#f87171'; status.textContent = res.error || 'Erreur d\'envoi'; }
}

// ════════════════════════════════════════════════════
//  SOCKET — temps réel
// ════════════════════════════════════════════════════
function startSocket() {
  S.socket = io();
  S.socket.emit('start_poll', { email: S.userEmail, password: '', folder: 'INBOX' });
  S.socket.on('new_mail', data => {
    document.getElementById('notif-dot').style.display = 'block';
    toast(`📬 ${data.count} nouveau(x) message(s)`, 'info');
    if (S.currentFolder === 'INBOX') loadEmails(true); // forcer refresh
  });
}

// ════════════════════════════════════════════════════
//  THÈME
// ════════════════════════════════════════════════════
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.getElementById('ico-moon').style.display = t==='dark'  ? 'block' : 'none';
  document.getElementById('ico-sun').style.display  = t==='light' ? 'block' : 'none';
}

// ════════════════════════════════════════════════════
//  SIDEBAR
// ════════════════════════════════════════════════════
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth < 768) {
    sb.classList.toggle('mobile-open');
  } else {
    S.sidebarCollapsed = !S.sidebarCollapsed;
    sb.classList.toggle('collapsed', S.sidebarCollapsed);
  }
}

// ════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════
function toast(msg, type) {
  const colors = {
    success: 'background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;',
    error:   'background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;',
    info:    'background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60a5fa;',
    warning: 'background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#fbbf24;',
  };
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.cssText = colors[type] || colors.info;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// ════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseFrom(from) {
  const m = String(from).match(/^"?([^"<]*)"?\s*<?([^>]*)>?$/);
  if (m) return { name: m[1].trim(), email: m[2].trim() };
  return { name: '', email: from };
}
function fmtDate(d) {
  if (!d) return '';
  const dt   = new Date(d);
  const now  = new Date();
  const diff = now - dt;
  if (diff < 60000)    return 'À l\'instant';
  if (diff < 3600000)  return Math.floor(diff/60000) + 'min';
  if (diff < 86400000) return dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if (diff < 604800000)return dt.toLocaleDateString('fr-FR',{weekday:'short'});
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}
function fmtSize(b) {
  if (!b) return '0B';
  if (b < 1024) return b+'B';
  if (b < 1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function sanitize(html) {
  return html
    .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,'')
    .replace(/\son\w+\s*=\s*["'][^"']*["']/gi,'')
    .replace(/javascript:/gi,'');
}
</script>
