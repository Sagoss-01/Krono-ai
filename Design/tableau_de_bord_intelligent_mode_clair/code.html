<style>

<span class="font-label-caps text-label-caps">Assistant</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-label-caps text-label-caps">Briefing</span>
</button>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.glass-panel');
        cards.forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        const scrollContainer = document.querySelector('main > div.overflow-y-auto');
        if (scrollContainer) {
            scrollContainer.scrollTop = 200;
        }
    });
</script>
